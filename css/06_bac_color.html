<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- property-name : value -->

    <h1 style="background-color:lightcoral ;">background-color normal color</h1>
    <h1 style="background-color:red ;">background-color normal color</h1>
    <h1 style="background-color:green ;">background-color normal color</h1>

    <h1 style="background-color:#e733d5 ;">background-color hexa #000 color</h1>


    <!-- red,green,blue  : 0 - 255 -->
    <h1 style="background-color:rgb(16, 234, 234) ;">background-color rgb color</h1>
    <h1 style="background-color:rgb(8, 3, 75) ;">background-color rgb color</h1>

    <!-- a : opcity (0-1) -->
    <h1 style="background-color:rgba(8, 3, 75, 0.71) ;">background-color rgb color</h1>


    <!-- hsl  -->
    <h1 style="background-color:hsl(45, 93%, 44%) ;">background-color hsl color</h1>
    <h1 style="background-color:hsla(45, 93%, 44%,.7) ;">background-color hsl color</h1>

</body>

</html>
