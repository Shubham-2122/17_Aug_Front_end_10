<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 
        pre inc  ++value = 1 
        post inc value++ = 1
    -->

    <script>

        let a = 1
        console.log("a :",a)

        a++ // post inc 
        console.log("a :",a)

        ++a // pre inc 
        console.log("a :",a)

        console.log("a :",++a)
        console.log("a :",++a)
        console.log("a :",a++)
        
        console.log("a :",--a)
        console.log("a :",a--)
console.log("a :",a)

    </script>


</body>
</html>
