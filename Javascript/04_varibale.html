<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- varibale : it's store a value in single varibale 
     

    Rules : 
    1) Do not start number 12shjg
    2) do not start symoble %#asd 
    3) Do not start keyword script for
    
    
    syntax
    
    type varin-name = value

    -->

    <script>

        // 1) var : global scope

        var a = 10 // decalration  allow
        var a = 15 // re-decalration allow
        a = 18 //re-assigemnet allow
        console.log("A : ",a)
        document.write("A :",a)

        // 2) let : local scope
        let b = 20 //// decalration  allow
        // let b = 25// re-decalration not allow
        b = 29 //re-assigemnet allow

        console.log("B :",b)

        // 3) const : unique scope 

        const x = 76 // decalration  allow
        // const x = 80 // re-decalration not allow
        // x = 85 //re-assigemnet not  allow

        console.log("X :",x)

    </script>

</body>
</html>
