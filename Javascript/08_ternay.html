<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- ()?true:false -->

    <script>

        let a = 20
        let b = 10

        let max = (a > b) ? true : false
        console.log(max)

        console.log((a < b) ? true : false)

        let x = 10 
        let y= "10"
        // onlye value
        console.log((x==y) ? true : false )
        
        // value and datatype 
        console.log((x===y) ? true : false )

        console.log((a < b) ? a : b)

        console.log((a != b) ? true : false)

    </script>

</body>

</html>
