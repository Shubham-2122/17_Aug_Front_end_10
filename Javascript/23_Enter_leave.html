<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="h1" onmouseenter="demo()" onmouseleave="test()">hello data</h1>

    <button onclick="demo()">Change style</button>

    <script>
        let h1_tag = document.getElementById("h1")

        function demo(){
            h1_tag.innerHTML = "Hello javascript"
            h1_tag.style.background = "blue"
            h1_tag.style.color = "white"
            h1_tag.style.fontSize = "60px"
        }


         function test(){
            h1_tag.innerHTML = "Hello data"
            h1_tag.style.background = "white"
            h1_tag.style.color = "black"
            h1_tag.style.fontSize = "36px"
        }

    </script>

</body>
</html>
