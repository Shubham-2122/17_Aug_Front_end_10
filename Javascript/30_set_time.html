<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <!-- setinterval : every 1 sec auatomaticall call -->

    <script>

        // setinterval : every 1 sec auatomaticall call

        function test(){
            console.log("Interval")
            document.write("inveral <br>")
        }

        setInterval(test,1000)


        // setTimeout : every 1 sec auatomaticall after 1 sec stop
        function demo(){
            console.log("Time data")
        }

        setTimeout(demo,2000)

    </script>

</body>
</html>
