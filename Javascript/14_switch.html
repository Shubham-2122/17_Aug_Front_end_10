<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let a = 20
        let b = 10

        let choice = "^"

        switch (choice) {
            case "+":
                console.log("Sum :", a + b)
                break
            case "-":
                console.log("Sub :", a - b)
                break
            case "*":
                console.log("Mul :", a * b)
                break
            case "/":
                console.log("div :", a / b)
                break

            default:
                console.log("Inavlid symbol")
                break;
        }

    </script>

</body>

</html>
