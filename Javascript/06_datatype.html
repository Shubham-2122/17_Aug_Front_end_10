    <!-- datatype : 
    primitve datatype : single value store
    non-primitve datatype : multiple value store -->

    <script>

        // 1) primtive : 
        // 1) number 

        let num = 83.545 
        console.log(num)
        console.log(typeof(num))

        // 2) string 
        let name1 = "hello"
        console.log(name1)
        console.log(typeof(name1))

        // 3) boolen 
        let data = false
        console.log(data)
        console.log(typeof(data)) 

        // 4) undefind 
        let ab 
        console.log(ab)
        console.log(typeof(ab))


        // 5) null 

        let demo = null 

        console.log(demo)
        console.log(typeof(demo))

        // 6) bigint
        let test = BigInt(214325432634643654)
        console.log(test)
        console.log(typeof(test))
