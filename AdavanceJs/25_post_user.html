<body>

    <script>

        fetch("https://jsonplaceholder.typicode.com/users", {
            method: "POST",
            headers: {

            body : JSON.stringify({
                name:"varj",

                address:{

        })
        .then((res)=>{
            return res.json()
        })
        .then((res)=>{
            console.log(res)
        })

    </script>

</body>
