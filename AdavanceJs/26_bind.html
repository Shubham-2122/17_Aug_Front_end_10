<html lang="en">
<head>

<body>
    
    <script>

        let test = {
            details : function demo(){
                console.log("Fname : ",this.fname," lname :",this.lname)
            }
        }


        let person = {
            fname : "nihar",
            lname:"patel"
        }

        // bind as object use
        let demo= test.details.bind(person)
        demo()
    </script>
