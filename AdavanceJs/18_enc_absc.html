<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- private -->

    <script>

        function Person(name,age){

            let _name = name; 
            let _age = age; 

            this.getName=()=>{
                return _name
            }

            this.getAge=()=>{
                return _age
            }

            this.setAge=(newage)=>{
                return _age = newage
            }

        }

        const user = new Person("het",23)

        console.log(user._name)
        console.log(user.getName())
        console.log(user.getAge())

        user.setAge(26)
        console.log(user.getAge())

    </script>
</body>
</html>
