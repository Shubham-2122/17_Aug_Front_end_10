<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <table class="table table-dark">
        <thead>
            <tr>
                <th scope="col">id</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">city</th>
                <th scope="col">Compnany</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((res) => {
                console.log(res)

                res.forEach((data, index) => {
                    console.log(data)

                    let tbody = document.querySelector("tbody")

                    let trow = tbody.insertRow()

                    let idcell = trow.insertCell(0)
                    let namecell = trow.insertCell(1)
                    let emailcell = trow.insertCell(2)
                    let citycell = trow.insertCell(3)
                    let compnayname = trow.insertCell(4)

                    idcell.textContent = data.id
                    namecell.textContent = data.name
                    emailcell.textContent = data.email
                    citycell.textContent = data.address.city
                    compnayname.textContent = data.company.name

                });
            })
    </script>

</body>

</html>
