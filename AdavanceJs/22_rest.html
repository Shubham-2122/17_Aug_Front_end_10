<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- ... : rest : store a value -->
     <!-- function paramter rest oparator  -->

    <script>

        function test(...demo){
            let sum = 0 
            for(let total in demo){
                sum = sum + demo[total]
            }
            return sum 
        }

        console.log(test(20,50,65,34))

    </script>

</body>
</html>
