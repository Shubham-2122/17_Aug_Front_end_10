<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        let arr = [1,2,3,4,5]

        console.log(arr)
        console.log(arr.length)

        // push : after data
        arr.push(8)
        console.log(arr)

        // pop : 
        arr.pop()
        console.log(arr)

        // unshid 
        arr.unshift(2)
        console.log(arr)

        // shift
        arr.shift()
        console.log(arr)

        // concat
        let arr1 = [6,7,8,9,10]

        let data = arr.concat(arr1)
        console.log(data)

        // data.forEach((val)=>{
        //     console.log(val)
        // })

        console.log(arr)

        console.log(arr.reverse())

        const words = ["spray", "elite", "exuberant", "destruction", "present"];

        const res = words.filter((test)=>
            test.length <= 5
        )

        console.log(res)


        const animals = ["ant", "bison", "camel", "duck", "elephant"];

        console.log(animals)
        console.log(animals.slice(2))
        console.log(animals.slice(1,4))

    </script>

</body>
</html>
